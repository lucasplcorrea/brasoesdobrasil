name: brasoes-do-brasil

services:
  coletor:
    image: lucasplcorrea/brasoes-do-brasil:${BRASOES_IMAGE_TAG:-0.2.2}
    pull_policy: always
    platform: linux/amd64
    user: '${WORKER_UID:-1000}:${WORKER_GID:-1000}'
    restart: on-failure:5
    init: true
    env_file:
      - .env.worker
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./docs:/app/docs
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
